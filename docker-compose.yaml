services:
    # 1. The Message Broker and Cache
    redis:
        image: redis:7-alpine
        restart: always

    # 2. The Backend Web Server (Django)
    web:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: my-django-app:latest
        command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        depends_on:
            - redis
        environment:
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0
            - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
            - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
            - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
            - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
            - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-}
            - DJANGO_BEHIND_HTTPS_PROXY=${DJANGO_BEHIND_HTTPS_PROXY:-False}
            - APP_ACCESS_KEY=${APP_ACCESS_KEY:-}
            - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-200}

    # 3. The Background Task Worker (Celery)
    worker:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: my-django-app:latest
        command: celery -A core worker --loglevel=info
        volumes:
            - ./backend:/app
        depends_on:
            - redis
            - web
        environment:
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0
            - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
            - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
            - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
            - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}

    # 4. The Spark Master
    spark:
        image: apache/spark:3.5.1
        user: root
        environment:
            - SPARK_DAEMON_JAVA_OPTS=-Dspark.rpc.askTimeout=300s -Dspark.network.timeout=300s
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        volumes:
            - ./backend:/app
        deploy:
            resources:
                limits:
                    memory: 512M

    # 5. The Spark Worker
    spark-worker:
        image: apache/spark:3.5.1
        user: root
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
        depends_on:
            - spark
        environment:
            - SPARK_WORKER_CORES=1
            - SPARK_WORKER_MEMORY=1G
        volumes:
            - ./backend:/app
        deploy:
            resources:
                limits:
                    memory: 1G

    # 6. The Frontend (Next.js)
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
                NEXT_PUBLIC_APP_ACCESS_KEY: ${NEXT_PUBLIC_APP_ACCESS_KEY:-}
        image: my-nextjs-app:latest
        ports:
            - "3000:3000"
        depends_on:
            - web
        environment:
            - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
            - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-}
