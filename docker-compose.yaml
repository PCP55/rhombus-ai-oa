services:
    # 1. The Message Broker and Cache
    redis:
        image: redis:7-alpine
        restart: always

    # 2. The Backend Web Server (Django)
    web:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: my-django-app:latest
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        depends_on:
            - redis
        environment:
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0

    # 3. The Background Task Worker (Celery)
    worker:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: my-django-app:latest
        command: celery -A core worker --loglevel=info
        volumes:
            - ./backend:/app
        depends_on:
            - redis
            - web
        environment:
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0

    # 4. The Spark Master
    spark:
        image: apache/spark:3.5.1
        user: root
        environment:
            - SPARK_DAEMON_JAVA_OPTS=-Dspark.rpc.askTimeout=300s -Dspark.network.timeout=300s
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        volumes:
            - ./backend:/app
        deploy:
            resources:
                limits:
                    memory: 512M

    # 5. The Spark Worker
    spark-worker:
        image: apache/spark:3.5.1
        user: root
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
        depends_on:
            - spark
        environment:
            - SPARK_WORKER_CORES=1
            - SPARK_WORKER_MEMORY=1G
        volumes:
            - ./backend:/app
        deploy:
            resources:
                limits:
                    memory: 1G
